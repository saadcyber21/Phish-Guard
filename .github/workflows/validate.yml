name: Phish-Guard Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Phish-Guard Analyzer
        run: |
          echo "Analyzing sample_phish.eml..."
          python analyzer.py sample_phish.eml